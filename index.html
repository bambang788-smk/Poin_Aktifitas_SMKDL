<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Poin & Absensi Siswa</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome untuk Ikon -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- ================= SECTION LOGIN ================= -->
  <div id="login-section" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-full mb-3">
          <i class="fa-solid fa-graduation-cap text-3xl"></i>
        </div>
        <h2 class="text-2xl font-bold tracking-tight text-white">SISTEM POIN & ABSENSI</h2>
        <p class="text-xs text-gray-400 mt-1">Silakan login dengan akun yang terdaftar</p>
      </div>
      
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="mb-5">
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-2">Username</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-solid fa-user"></i>
            </span>
            <input type="text" id="username" required placeholder="Masukkan username"
              class="w-full pl-10 pr-4 py-2.5 bg-gray-700/50 border border-gray-600 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white placeholder-gray-400 transition">
          </div>
        </div>
        
        <div class="mb-6">
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-2">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="password" required placeholder="••••••••"
              class="w-full pl-10 pr-4 py-2.5 bg-gray-700/50 border border-gray-600 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white placeholder-gray-400 transition">
          </div>
        </div>

        <!-- Alert Error Login -->
        <div id="login-error" class="text-red-400 bg-red-900/30 border border-red-500/30 p-3 rounded-lg text-sm mb-5 hidden flex items-center gap-2">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="login-error-text"></span>
        </div>

        <button type="submit" id="btn-login" 
          class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/30 flex justify-center items-center gap-2">
          <span>Login</span>
          <i class="fa-solid fa-right-to-bracket"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- ================= SECTION DASHBOARD ================= -->
  <div id="dashboard-section" class="hidden min-h-screen flex flex-col">
    <!-- Navbar Navigation Header -->
    <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          
          <!-- Logo & Brand Name -->
          <div class="flex items-center space-x-3">
            <span class="bg-indigo-600 text-white p-2 rounded-lg">
              <i class="fa-solid fa-school text-lg"></i>
            </span>
            <span class="font-bold text-lg text-white tracking-wide">Poin & Absensi Siswa</span>
          </div>

          <!-- User Profile & Logout -->
          <div class="flex items-center space-x-4">
            <div class="hidden sm:flex items-center space-x-2 bg-gray-700/50 px-3 py-1.5 rounded-lg border border-gray-600">
              <i class="fa-solid fa-user-circle text-indigo-400 text-lg"></i>
              <span id="user-info" class="text-sm font-medium text-gray-200"></span>
            </div>
            
            <button onclick="logout()" 
              class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/30 hover:border-red-600 px-3 py-1.5 rounded-lg text-sm font-medium transition duration-200 flex items-center gap-1.5">
              <i class="fa-solid fa-arrow-right-from-bracket"></i>
              <span>Logout</span>
            </button>
          </div>

        </div>
      </div>

      <!-- Tab Menu Container (Menu Utama Berdasarkan Role Login) -->
      <div class="bg-gray-800/80 border-t border-gray-700 px-4 sm:px-8 py-2 overflow-x-auto scrollbar-thin">
        <div class="flex space-x-2 max-w-7xl mx-auto" id="menu-container">
          <!-- Item Menu Utama akan otomatis di-generate oleh app.js -->
        </div>
      </div>
    </nav>

    <!-- Main Content Display -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 md:p-8" id="main-content">
      <!-- Konten Per Modul (Absensi / Pelanggaran / Prestasi / Laporan) Dimuat Di Sini -->
    </main>
    
    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 py-4 text-center text-xs text-gray-500">
      &copy; 2026 Sistem Catatan Poin & Absensi Siswa SMK.
    </footer>
  </div>

  <!-- Pemanggilan Script Lokal (Order/Urutan Sangat Penting) -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
